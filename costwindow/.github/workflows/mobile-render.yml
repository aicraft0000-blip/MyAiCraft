name: Mobile render gate

# Blocks any change that makes the sign-in or register controls unreachable
# on a phone. See frontend/scripts/check-mobile-render.mjs for why this exists.

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/mobile-render.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/mobile-render.yml']
  workflow_dispatch:

jobs:
  render:
    name: Auth CTAs reachable on phone widths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Installed here rather than as a project devDependency, so Playwright
      # never enters the Cloudflare Pages production build path.
      - name: Install Playwright
        run: npm install --no-save playwright@1.62.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Check mobile render
        run: npm run check:render
